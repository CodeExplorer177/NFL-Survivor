<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>2026 NFL Survivor</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        sans-serif;

      background: #f4f4f4;

      color: #222;

    }


    .container {

      max-width: 1000px;

      margin: auto;

    }


    h1 {

      text-align: center;

      margin-bottom: 20px;

    }


    .card {

      background: white;

      padding: 20px;

      border-radius: 12px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.12);

      margin-bottom: 20px;

    }


    label {

      display: block;

      font-weight: bold;

      margin-bottom: 8px;

    }


    select,
    button {

      width: 100%;

      padding: 13px;

      font-size: 16px;

      border-radius: 8px;

      border: 1px solid #ccc;

    }


    select {

      background: white;

    }


    button {

      margin-top: 15px;

      background: #222;

      color: white;

      cursor: pointer;

      border: none;

      font-weight: bold;

    }


    button:disabled {

      background: #888;

      cursor: not-allowed;

    }


    .refresh-button {

      margin-top: 0;

      margin-bottom: 15px;

      background: #555;

    }


    .status {

      margin-top: 15px;

      padding: 12px;

      border-radius: 8px;

      display: none;

    }


    .success {

      background: #dff5df;

      color: #176b17;

    }


    .error {

      background: #f8dddd;

      color: #8a1c1c;

    }


    .current-pick {

      margin-top: 15px;

      font-size: 16px;

      font-weight: bold;

    }



    /* =========================================
       LIVE SURVIVOR TABLE
       ========================================= */

    .table-wrapper {

      width: 100%;

      overflow-x: auto;

      overflow-y: hidden;

      -webkit-overflow-scrolling: touch;

      border: 1px solid #ddd;

      border-radius: 8px;

      background: white;

    }


    .survivor-table {

      border-collapse: collapse;

      width: 100%;

      min-width: 1050px;

      font-size: 14px;

    }


    .survivor-table th {

      background: #222;

      color: white;

      font-weight: bold;

      text-align: center;

      padding: 10px 8px;

      white-space: nowrap;

      position: sticky;

      top: 0;

      z-index: 2;

    }


    .survivor-table td {

      padding: 9px 8px;

      border-bottom: 1px solid #ddd;

      border-right: 1px solid #eee;

      text-align: center;

      white-space: nowrap;

    }


    .survivor-table td.player-name {

      text-align: left;

      font-weight: bold;

      position: sticky;

      left: 0;

      background: white;

      z-index: 1;

    }


    .survivor-table th.player-header {

      position: sticky;

      left: 0;

      z-index: 3;

    }


    .survivor-table tr:nth-child(even) td {

      background: #f8f8f8;

    }


    .survivor-table tr:nth-child(even)
    td.player-name {

      background: #f8f8f8;

    }


    .empty-pick {

      color: #aaa;

    }


    .table-loading {

      padding: 25px;

      text-align: center;

      color: #666;

    }


    .table-last-updated {

      margin-top: 10px;

      font-size: 13px;

      color: #777;

      text-align: right;

    }



    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 600px) {

      body {

        padding: 10px;

      }


      .container {

        width: 100%;

      }


      .card {

        padding: 15px;

      }


      h1 {

        font-size: 24px;

      }


      .survivor-table {

        /*
          Smaller table on phones.
          This is the "zoomed out" effect.
        */

        min-width: 900px;

        font-size: 10px;

      }


      .survivor-table th {

        padding: 6px 5px;

        font-size: 10px;

      }


      .survivor-table td {

        padding: 6px 5px;

      }


      .survivor-table td.player-name {

        min-width: 75px;

        max-width: 75px;

        overflow: hidden;

        text-overflow: ellipsis;

      }


      .table-wrapper {

        overflow-x: auto;

        overflow-y: hidden;

      }

    }

  </style>

</head>



<body>


<div class="container">


  <!-- =========================================
       HEADER
       ========================================= -->

  <h1>
    🏈 2026 NFL Survivor
  </h1>



  <!-- =========================================
       PICK FORM
       ========================================= -->

  <div class="card">


    <label for="player">
      Select Your Name
    </label>


    <select id="player">

      <option value="">
        Loading players...
      </option>

    </select>


    <br>
    <br>


    <label for="team">
      Select Your Week 2 Team
    </label>


    <select
      id="team"
      disabled
    >

      <option value="">
        Select a player first
      </option>

    </select>


    <div
      id="currentPick"
      class="current-pick">
    </div>


    <button
      id="submitButton"
      disabled
    >
      Submit Pick
    </button>


    <div
      id="status"
      class="status">
    </div>


  </div>



  <!-- =========================================
       LIVE SURVIVOR TABLE
       ========================================= -->

  <div class="card">


    <h2>
      Current Survivor Picks
    </h2>


    <button
      id="refreshButton"
      class="refresh-button"
    >
      🔄 Refresh Picks
    </button>


    <div class="table-wrapper">

      <table
        id="survivorTable"
        class="survivor-table"
      >

        <thead>

          <tr id="tableHeader">

            <th>
              Player
            </th>

          </tr>

        </thead>


        <tbody id="tableBody">

          <tr>

            <td
              colspan="19"
              class="table-loading"
            >
              Loading survivor picks...
            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <div
      id="lastUpdated"
      class="table-last-updated">
    </div>


  </div>


</div>



<!-- =========================================
     HIDDEN SUBMISSION FRAME
     ========================================= -->

<iframe
  id="submitFrame"
  style="display:none;"
></iframe>



<script>


/* =========================================
   SETTINGS
   ========================================= */

const CURRENT_WEEK = 2;


const API_URL =
  "https://script.google.com/macros/s/AKfycbyRawQPUdHospSvL4881AcQh41bHAJZcGAqFqrumjmMB112Cl-6yVPmlE1kaNIj6PI2Tg/exec";



/* =========================================
   NFL TEAMS
   ========================================= */

const TEAMS = [

  "49ers",
  "Bears",
  "Bengals",
  "Bills",
  "Broncos",
  "Browns",
  "Buccaneers",
  "Cardinals",
  "Chargers",
  "Chiefs",
  "Colts",
  "Commanders",
  "Cowboys",
  "Dolphins",
  "Eagles",
  "Falcons",
  "Giants",
  "Jaguars",
  "Jets",
  "Lions",
  "Packers",
  "Panthers",
  "Patriots",
  "Raiders",
  "Rams",
  "Ravens",
  "Saints",
  "Seahawks",
  "Steelers",
  "Texans",
  "Titans",
  "Vikings"

];



/* =========================================
   PAGE ELEMENTS
   ========================================= */

const playerSelect =
  document.getElementById(
    "player"
  );


const teamSelect =
  document.getElementById(
    "team"
  );


const submitButton =
  document.getElementById(
    "submitButton"
  );


const refreshButton =
  document.getElementById(
    "refreshButton"
  );


const statusBox =
  document.getElementById(
    "status"
  );


const currentPickBox =
  document.getElementById(
    "currentPick"
  );


const submitFrame =
  document.getElementById(
    "submitFrame"
  );


const tableHeader =
  document.getElementById(
    "tableHeader"
  );


const tableBody =
  document.getElementById(
    "tableBody"
  );


const lastUpdated =
  document.getElementById(
    "lastUpdated"
  );



/* =========================================
   JSONP
   ========================================= */

function jsonp(
  action,
  params = {},
  timeout = 10000
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "jsonpCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished = false;


      let timer;


      function cleanup() {

        if (finished) {
          return;
        }


        finished = true;


        clearTimeout(timer);


        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }


      window[
        callbackName
      ] =
        function(data) {

          cleanup();

          resolve(data);

        };


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              "Could not connect to the NFL Survivor server."
            )
          );

        };


      let url =
        API_URL +
        "?action=" +
        encodeURIComponent(
          action
        ) +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&_=" +
        Date.now();


      for (
        const key in params
      ) {

        url +=
          "&" +
          encodeURIComponent(
            key
          ) +
          "=" +
          encodeURIComponent(
            params[key]
          );

      }


      document.body.appendChild(
        script
      );


      script.src =
        url;


      timer =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                "The server took too long to respond."
              )
            );

          },
          timeout
        );

    }
  );

}



/* =========================================
   LOAD PLAYERS
   ========================================= */

async function loadPlayers() {

  try {

    playerSelect.innerHTML =
      '<option value="">Loading players...</option>';


    const data =
      await jsonp(
        "getPlayers"
      );


    if (
      !data ||
      !data.success
    ) {

      throw new Error(
        data && data.error
          ? data.error
          : "Unable to load players."
      );

    }


    playerSelect.innerHTML =
      '<option value="">Select your name</option>';


    data.players.forEach(
      player => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          player;


        option.textContent =
          player;


        playerSelect.appendChild(
          option
        );

      }
    );

  }

  catch (error) {

    console.error(error);


    playerSelect.innerHTML =
      '<option value="">Error loading players</option>';


    showStatus(
      "Could not load the player list. Please refresh the page.",
      "error"
    );

  }

}



/* =========================================
   LOAD PLAYER DATA
   ========================================= */

async function loadPlayerData(
  player
) {

  if (!player) {

    teamSelect.disabled =
      true;


    teamSelect.innerHTML =
      '<option value="">Select a player first</option>';


    submitButton.disabled =
      true;


    currentPickBox.textContent =
      "";


    return;

  }


  try {

    teamSelect.disabled =
      true;


    teamSelect.innerHTML =
      '<option value="">Loading teams...</option>';


    submitButton.disabled =
      true;


    const data =
      await jsonp(
        "getPlayerData",
        {
          player: player
        }
      );


    if (
      !data ||
      !data.success
    ) {

      throw new Error(
        data && data.error
          ? data.error
          : "Unable to load player data."
      );

    }


    const picks =
      data.picks || {};


    const currentWeekName =
      "Week " +
      CURRENT_WEEK;


    const currentPick =
      picks[
        currentWeekName
      ] || "";


    const usedTeams =
      new Set(

        Object.entries(
          picks
        )

        .filter(
          ([week, team]) =>
            week !==
              currentWeekName &&
            team
        )

        .map(
          ([week, team]) =>
            team
        )

      );


    if (currentPick) {

      currentPickBox.textContent =
        "Current Week " +
        CURRENT_WEEK +
        " Pick: " +
        currentPick;

    }

    else {

      currentPickBox.textContent =
        "No Week " +
        CURRENT_WEEK +
        " pick submitted yet.";

    }


    teamSelect.innerHTML =
      '<option value="">Select a team</option>';


    TEAMS.forEach(
      team => {

        if (
          usedTeams.has(team)
        ) {

          return;

        }


        const option =
          document.createElement(
            "option"
          );


        option.value =
          team;


        option.textContent =
          team;


        if (
          team === currentPick
        ) {

          option.textContent =
            team +
            " (Current Pick)";


          option.selected =
            true;

        }


        teamSelect.appendChild(
          option
        );

      }
    );


    teamSelect.disabled =
      false;


    submitButton.disabled =
      false;


    submitButton.textContent =
      currentPick
        ? "Change My Pick"
        : "Submit Pick";

  }

  catch (error) {

    console.error(error);


    teamSelect.innerHTML =
      '<option value="">Error loading teams</option>';


    showStatus(
      "Could not load this player's data. Please try again.",
      "error"
    );

  }

}



/* =========================================
   LOAD LIVE TABLE
   ========================================= */

async function loadTable() {

  try {

    tableBody.innerHTML =

      '<tr>' +

      '<td colspan="19" class="table-loading">' +

      'Loading survivor picks...' +

      '</td>' +

      '</tr>';


    const data =
      await jsonp(
        "getAllData"
      );


    if (
      !data ||
      !data.success
    ) {

      throw new Error(
        data && data.error
          ? data.error
          : "Unable to load survivor data."
      );

    }


    /*
      Build header.
    */

    tableHeader.innerHTML =
      "<th class='player-header'>" +
      "Player" +
      "</th>";


    data.headers.forEach(
      header => {

        const th =
          document.createElement(
            "th"
          );


        th.textContent =
          header;


        tableHeader.appendChild(
          th
        );

      }
    );


    /*
      Clear table.
    */

    tableBody.innerHTML =
      "";


    /*
      Build player rows.
    */

    data.players.forEach(
      player => {

        const tr =
          document.createElement(
            "tr"
          );


        /*
          Player name.
        */

        const nameCell =
          document.createElement(
            "td"
          );


        nameCell.className =
          "player-name";


        nameCell.textContent =
          player.name;


        tr.appendChild(
          nameCell
        );


        /*
          Weekly picks.
        */

        data.headers.forEach(
          week => {

            const td =
              document.createElement(
                "td"
              );


            const pick =
              player.picks[
                week
              ] || "";


            if (pick) {

              td.textContent =
                pick;

            }

            else {

              td.textContent =
                "—";

              td.className =
                "empty-pick";

            }


            tr.appendChild(
              td
            );

          }
        );


        tableBody.appendChild(
          tr
        );

      }
    );


    /*
      Last updated time.
    */

    const now =
      new Date();


    lastUpdated.textContent =
      "Last updated: " +
      now.toLocaleTimeString();


  }

  catch (error) {

    console.error(error);


    tableBody.innerHTML =

      '<tr>' +

      '<td colspan="19" class="table-loading">' +

      'Could not load survivor picks. ' +
      'Please try again.' +

      '</td>' +

      '</tr>';

  }

}



/* =========================================
   SUBMIT PICK
   ========================================= */

async function submitPick() {

  const player =
    playerSelect.value;


  const team =
    teamSelect.value;


  if (!player) {

    showStatus(
      "Please select your name.",
      "error"
    );

    return;

  }


  if (!team) {

    showStatus(
      "Please select a team.",
      "error"
    );

    return;

  }


  submitButton.disabled =
    true;


  submitButton.textContent =
    "Saving...";


  hideStatus();


  try {

    /*
      Get current data first.
    */

    const beforeData =
      await jsonp(
        "getPlayerData",
        {
          player: player
        }
      );


    if (
      !beforeData.success
    ) {

      throw new Error(
        beforeData.error ||
        "Unable to verify player."
      );

    }


    const previousTeam =
      (
        beforeData.picks || {}
      )[
        "Week " +
        CURRENT_WEEK
      ] || "";


    /*
      Build submission URL.
    */

    const submitURL =
      API_URL +
      "?action=submitPick" +
      "&player=" +
      encodeURIComponent(
        player
      ) +
      "&week=" +
      encodeURIComponent(
        CURRENT_WEEK
      ) +
      "&team=" +
      encodeURIComponent(
        team
      ) +
      "&_=" +
      Date.now();


    /*
      Send through hidden iframe.
    */

    submitFrame.src =
      submitURL;


    /*
      Wait for Apps Script
      to process the write.
    */

    await wait(1800);


    /*
      Verify the new pick.
    */

    let confirmed =
      false;


    for (
      let attempt = 0;
      attempt < 5;
      attempt++
    ) {

      const checkData =
        await jsonp(
          "getPlayerData",
          {
            player: player
          }
        );


      if (
        checkData.success &&
        checkData.picks &&
        checkData.picks[
          "Week " +
          CURRENT_WEEK
        ] === team
      ) {

        confirmed =
          true;

        break;

      }


      await wait(1000);

    }


    if (!confirmed) {

      throw new Error(
        "The pick was not confirmed by the spreadsheet. Please try again."
      );

    }


    /*
      Update current pick.
    */

    currentPickBox.textContent =
      "Current Week " +
      CURRENT_WEEK +
      " Pick: " +
      team;


    submitButton.textContent =
      "Change My Pick";


    if (previousTeam) {

      showStatus(
        "Pick changed from " +
        previousTeam +
        " to " +
        team +
        ".",
        "success"
      );

    }

    else {

      showStatus(
        "Your Week " +
        CURRENT_WEEK +
        " pick is " +
        team +
        ".",
        "success"
      );

    }


    /*
      IMPORTANT:
      Reload the live table immediately.
      No Google Sheet cache involved.
    */

    await loadTable();


  }

  catch (error) {

    console.error(error);


    showStatus(
      error.message ||
      "Something went wrong. Please try again.",
      "error"
    );


    submitButton.disabled =
      false;


    submitButton.textContent =
      "Submit Pick";

  }

}



/* =========================================
   HELPERS
   ========================================= */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function showStatus(
  message,
  type
) {

  statusBox.textContent =
    message;


  statusBox.className =
    "status " +
    type;


  statusBox.style.display =
    "block";

}


function hideStatus() {

  statusBox.style.display =
    "none";

}



/* =========================================
   EVENTS
   ========================================= */

playerSelect.addEventListener(
  "change",
  () => {

    hideStatus();


    loadPlayerData(
      playerSelect.value
    );

  }
);


teamSelect.addEventListener(
  "change",
  () => {

    hideStatus();

  }
);


submitButton.addEventListener(
  "click",
  submitPick
);


refreshButton.addEventListener(
  "click",
  async () => {

    refreshButton.disabled =
      true;


    refreshButton.textContent =
      "Refreshing...";


    await loadTable();


    refreshButton.disabled =
      false;


    refreshButton.textContent =
      "🔄 Refresh Picks";

  }
);



/* =========================================
   START
   ========================================= */

loadPlayers();

loadTable();


</script>


</body>

</html>
