<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2026 NFL Survivor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    select {
      background: white;
    }

    button {
      margin-top: 15px;
      background: #222;
      color: white;
      cursor: pointer;
      border: none;
      font-weight: bold;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dff5df;
      color: #176b17;
    }

    .error {
      background: #f8dddd;
      color: #8a1c1c;
    }

    .current-pick {
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
    }

    .sheet-wrapper {
      width: 100%;
      height: 700px;
      overflow: auto;
      border-radius: 8px;
      background: white;
    }

    .sheet-zoom {
      width: 150%;
      transform: scale(0.67);
      transform-origin: top left;
    }

    .sheet-zoom iframe {
      width: 100%;
      height: 1050px;
      border: none;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 15px;
      }

      h1 {
        font-size: 24px;
      }

      .sheet-wrapper {
        height: 650px;
      }

      .sheet-zoom {
        width: 160%;
        transform: scale(0.625);
      }

      .sheet-zoom iframe {
        height: 1050px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🏈 2026 NFL Survivor</h1>

  <div class="card">

    <label for="player">Select Your Name</label>

    <select id="player">
      <option value="">Loading players...</option>
    </select>

    <br><br>

    <label for="team">Select Your Week 2 Team</label>

    <select id="team" disabled>
      <option value="">Select a player first</option>
    </select>

    <div id="currentPick" class="current-pick"></div>

    <button id="submitButton" disabled>
      Submit Pick
    </button>

    <div id="status" class="status"></div>

  </div>


  <div class="card">

    <h2>Current Survivor Picks</h2>

    <div class="sheet-wrapper">

      <div class="sheet-zoom">

        <iframe
          src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS9wInRS8cYLjP5YEjlfKs9H6EI2eE5ZmqqVYCSvZu6RY3xboNaCSqBBD5CMysFeUi2iVGwPQ5K2Bvu/pubhtml?widget=true&headers=false">
        </iframe>

      </div>

    </div>

  </div>

</div>


<!-- Hidden iframe used to submit the GET request -->
<iframe
  id="submitFrame"
  style="display:none;">
</iframe>


<script>

const CURRENT_WEEK = 2;

const API_URL =
  "https://script.google.com/macros/s/AKfycbyRawQPUdHospSvL4881AcQh41bHAJZcGAqFqrumjmMB112Cl-6yVPmlE1kaNIj6PI2Tg/exec";


const TEAMS = [
  "49ers",
  "Bears",
  "Bengals",
  "Bills",
  "Broncos",
  "Browns",
  "Buccaneers",
  "Cardinals",
  "Chargers",
  "Chiefs",
  "Colts",
  "Commanders",
  "Cowboys",
  "Dolphins",
  "Eagles",
  "Falcons",
  "Giants",
  "Jaguars",
  "Jets",
  "Lions",
  "Packers",
  "Panthers",
  "Patriots",
  "Raiders",
  "Rams",
  "Ravens",
  "Saints",
  "Seahawks",
  "Steelers",
  "Texans",
  "Titans",
  "Vikings"
];


const playerSelect = document.getElementById("player");
const teamSelect = document.getElementById("team");
const submitButton = document.getElementById("submitButton");
const statusBox = document.getElementById("status");
const currentPickBox = document.getElementById("currentPick");
const submitFrame = document.getElementById("submitFrame");



/* ---------------------------------------
   JSONP HELPER
--------------------------------------- */

function jsonp(action, params = {}, timeout = 10000) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "jsonpCallback_" + Date.now() + "_" +
      Math.floor(Math.random() * 100000);

    const script = document.createElement("script");

    let finished = false;

    function cleanup() {

      if (finished) return;

      finished = true;

      clearTimeout(timer);

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    window[callbackName] = function(data) {

      cleanup();

      resolve(data);

    };


    script.onerror = function() {

      cleanup();

      reject(new Error("Could not connect to the NFL Survivor server."));

    };


    let url =
      API_URL +
      "?action=" + encodeURIComponent(action) +
      "&callback=" + encodeURIComponent(callbackName) +
      "&_=" + Date.now();


    for (const key in params) {

      url +=
        "&" +
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(params[key]);

    }


    document.body.appendChild(script);

    script.src = url;


    const timer = setTimeout(() => {

      cleanup();

      reject(new Error("The server took too long to respond."));

    }, timeout);

  });

}



/* ---------------------------------------
   LOAD PLAYERS
--------------------------------------- */

async function loadPlayers() {

  try {

    playerSelect.innerHTML =
      '<option value="">Loading players...</option>';

    const data = await jsonp("getPlayers");

    if (!data || !data.success) {
      throw new Error(
        data && data.error
          ? data.error
          : "Unable to load players."
      );
    }


    playerSelect.innerHTML =
      '<option value="">Select your name</option>';


    data.players.forEach(player => {

      const option =
        document.createElement("option");

      option.value = player;
      option.textContent = player;

      playerSelect.appendChild(option);

    });


  } catch (error) {

    console.error(error);

    playerSelect.innerHTML =
      '<option value="">Error loading players</option>';

    showStatus(
      "Could not load the player list. Please refresh the page.",
      "error"
    );

  }

}



/* ---------------------------------------
   LOAD PLAYER DATA
--------------------------------------- */

async function loadPlayerData(player) {

  if (!player) {

    teamSelect.disabled = true;

    teamSelect.innerHTML =
      '<option value="">Select a player first</option>';

    submitButton.disabled = true;

    currentPickBox.textContent = "";

    return;

  }


  try {

    teamSelect.disabled = true;

    teamSelect.innerHTML =
      '<option value="">Loading teams...</option>';

    submitButton.disabled = true;

    const data =
      await jsonp(
        "getPlayerData",
        { player: player }
      );


    if (!data || !data.success) {

      throw new Error(
        data && data.error
          ? data.error
          : "Unable to load player data."
      );

    }


    const picks = data.picks || {};

    const currentWeekName =
      "Week " + CURRENT_WEEK;

    const currentPick =
      picks[currentWeekName] || "";


    const usedTeams =
      new Set(
        Object.entries(picks)
          .filter(([week, team]) =>
            week !== currentWeekName &&
            team
          )
          .map(([week, team]) => team)
      );


    if (currentPick) {

      currentPickBox.textContent =
        "Current Week " +
        CURRENT_WEEK +
        " Pick: " +
        currentPick;

    } else {

      currentPickBox.textContent =
        "No Week " +
        CURRENT_WEEK +
        " pick submitted yet.";

    }


    teamSelect.innerHTML =
      '<option value="">Select a team</option>';


    TEAMS.forEach(team => {

      if (usedTeams.has(team)) {
        return;
      }


      const option =
        document.createElement("option");

      option.value = team;

      option.textContent = team;


      if (team === currentPick) {

        option.textContent =
          team + " (Current Pick)";

        option.selected = true;

      }


      teamSelect.appendChild(option);

    });


    teamSelect.disabled = false;

    submitButton.disabled = false;

    submitButton.textContent =
      currentPick
        ? "Change My Pick"
        : "Submit Pick";


  } catch (error) {

    console.error(error);

    teamSelect.innerHTML =
      '<option value="">Error loading teams</option>';

    showStatus(
      "Could not load this player's data. Please try again.",
      "error"
    );

  }

}



/* ---------------------------------------
   SUBMIT PICK
--------------------------------------- */

async function submitPick() {

  const player = playerSelect.value;

  const team = teamSelect.value;


  if (!player) {

    showStatus(
      "Please select your name.",
      "error"
    );

    return;

  }


  if (!team) {

    showStatus(
      "Please select a team.",
      "error"
    );

    return;

  }


  submitButton.disabled = true;

  submitButton.textContent = "Saving...";

  hideStatus();


  try {

    /*
      Get the current data first.
      This gives us the old pick so we can
      verify the change afterward.
    */

    const beforeData =
      await jsonp(
        "getPlayerData",
        { player: player }
      );


    if (!beforeData.success) {
      throw new Error(
        beforeData.error || "Unable to verify player."
      );
    }


    const previousTeam =
      (beforeData.picks || {})[
        "Week " + CURRENT_WEEK
      ] || "";


    /*
      Build the exact GET URL that we already
      confirmed successfully writes to the sheet.
    */

    const submitURL =
      API_URL +
      "?action=submitPick" +
      "&player=" +
      encodeURIComponent(player) +
      "&week=" +
      encodeURIComponent(CURRENT_WEEK) +
      "&team=" +
      encodeURIComponent(team) +
      "&_=" +
      Date.now();


    /*
      Send the request through the hidden iframe.
    */

    submitFrame.src = submitURL;


    /*
      Give Apps Script time to process the write.
    */

    await wait(1800);


    /*
      Verify the spreadsheet now contains
      the selected team.
    */

    let confirmed = false;


    for (let attempt = 0; attempt < 5; attempt++) {

      const checkData =
        await jsonp(
          "getPlayerData",
          { player: player }
        );


      if (
        checkData.success &&
        checkData.picks &&
        checkData.picks[
          "Week " + CURRENT_WEEK
        ] === team
      ) {

        confirmed = true;
        break;

      }


      await wait(1000);

    }


    if (!confirmed) {

      throw new Error(
        "The pick was not confirmed by the spreadsheet. Please try again."
      );

    }


    /*
      Update the form immediately.
    */

    currentPickBox.textContent =
      "Current Week " +
      CURRENT_WEEK +
      " Pick: " +
      team;


    submitButton.textContent =
      "Change My Pick";


    if (previousTeam) {

      showStatus(
        "Pick changed from " +
        previousTeam +
        " to " +
        team +
        ".",
        "success"
      );

    } else {

      showStatus(
        "Your Week " +
        CURRENT_WEEK +
        " pick is " +
        team +
        ".",
        "success"
      );

    }


    /*
      Reload the entire page so the published
      Google Sheet refreshes too.
    */

    await wait(2500);

    window.location.reload();


  } catch (error) {

    console.error(error);

    showStatus(
      error.message ||
      "Something went wrong. Please try again.",
      "error"
    );

    submitButton.disabled = false;

    submitButton.textContent =
      "Submit Pick";

  }

}



/* ---------------------------------------
   HELPERS
--------------------------------------- */

function wait(ms) {

  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );

}


function showStatus(message, type) {

  statusBox.textContent = message;

  statusBox.className =
    "status " + type;

  statusBox.style.display = "block";

}


function hideStatus() {

  statusBox.style.display = "none";

}



/* ---------------------------------------
   EVENTS
--------------------------------------- */

playerSelect.addEventListener(
  "change",
  () => {

    hideStatus();

    loadPlayerData(
      playerSelect.value
    );

  }
);


teamSelect.addEventListener(
  "change",
  () => {

    hideStatus();

  }
);


submitButton.addEventListener(
  "click",
  submitPick
);



/* ---------------------------------------
   START
--------------------------------------- */

loadPlayers();

</script>

</body>
</html>
