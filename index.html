<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Survivor 2026</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .button {
            display: block;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 25px;
            padding: 18px;
            background: #16a34a;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
        }

        .button:hover {
            background: #15803d;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        h2 {
            margin-top: 0;
        }

        .sheet {
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
        }

        iframe {
            width: 100%;
            height: 700px;
            border: 0;
        }

        .rules {
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 26px;
            }

            .container {
                padding: 12px;
            }

            .card {
                padding: 15px;
            }

            iframe {
                height: 600px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🏈 NFL Survivor 2026</h1>
    <p>Pick one team each week. Don't get eliminated!</p>
</header>

<div class="container">

    <div class="card">
        <a
            class="button"
            href="https://docs.google.com/forms/d/e/1FAIpQLSdgThvNkt_m4yko8XywheUCjXQLgQ0_l-dn9obdGl9iD3iU0A/viewform"
            target="_blank">
            🏈 SUBMIT YOUR PICK
        </a>
    </div>

    <div class="card">
        <h2>📊 Current Standings</h2>

        <div class="sheet">
            <iframe
                src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS9wInRS8cYLjP5YEjlfKs9H6EI2eE5ZmqqVYCSvZu6RY3xboNaCSqBBD5CMysFeUi2iVGwPQ5K2Bvu/pubhtml?widget=true&headers=false">
            </iframe>
        </div>
    </div>

    <div class="card rules">
        <h2>📋 Rules</h2>

        <p>
            Pick one NFL team each week.
            Once you use a team, you cannot use that team again.
        </p>

        <p>
            Picks must be submitted before the team's game starts.
        </p>
    </div>

</div>

<footer>
    NFL Survivor 2026
</footer>

</body>
</html>
