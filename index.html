  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 12px;

      font-family: Arial, sans-serif;

      background: #f4f6f8;

      color: #222;

    }


    .container {

      max-width: 1000px;

      margin: 0 auto;

    }


    h1 {

      text-align: center;

      margin: 10px 0 20px;

      font-size: 28px;

    }


    .card {

      background: white;

      padding: 18px;

      border-radius: 12px;

      margin-bottom: 18px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08);

    }


    h2 {

      margin-top: 0;

    }


    label {

      display: block;

      font-weight: bold;

      margin-bottom: 8px;

    }


    select,
    button {

      width: 100%;

      padding: 13px;

      font-size: 16px;

      border-radius: 8px;

      border: 1px solid #ccc;

    }


    select {

      background: white;

    }


    button {

      margin-top: 15px;

      background: #1f2937;

      color: white;

      border: none;

      cursor: pointer;

      font-weight: bold;

    }


    button:hover {

      background: #111827;

    }


    button:disabled {

      background: #9ca3af;

      cursor: not-allowed;

    }


    .status {

      margin-top: 15px;

      padding: 12px;

      border-radius: 8px;

      display: none;

    }


    .success {

      display: block;

      background: #dcfce7;

      color: #166534;

    }


    .error {

      display: block;

      background: #fee2e2;

      color: #991b1b;

    }


    .info {

      display: block;

      background: #e0f2fe;

      color: #075985;

    }


    .current-pick {

      margin: 12px 0;

      padding: 12px;

      background: #f3f4f6;

      border-radius: 8px;

      font-weight: bold;

    }


    .small {

      color: #666;

      font-size: 14px;

      margin-top: 8px;

      line-height: 1.4;

    }


    /* ==========================================
       GOOGLE SHEET
       ========================================== */

    .sheet-wrapper {

      width: 100%;

      height: 700px;

      overflow: auto;

      border-radius: 8px;

      border: 1px solid #ddd;

      background: white;

    }


    .sheet-zoom {

      width: 150%;

      transform: scale(0.67);

      transform-origin: top left;

    }


    #sheetFrame {

      width: 100%;

      height: 1050px;

      border: none;

      display: block;

    }


    /* ==========================================
       MOBILE
       ========================================== */

    @media (max-width: 600px) {

      body {

        padding: 8px;

      }


      .card {

        padding: 14px;

      }


      h1 {

        font-size: 24px;

      }


      .sheet-wrapper {

        height: 650px;

      }


      .sheet-zoom {

        width: 160%;

        transform: scale(0.625);

        transform-origin: top left;

      }


      #sheetFrame {

        height: 1050px;

      }

    }

  </style>

<script>

const CURRENT_WEEK = 2;

const teams = [

  "Bills",

const playerSelect =
  document.getElementById("player");


const teamSelect =
  document.getElementById("team");


const submitButton =
  document.getElementById("submitButton");


const playerInfo =
  document.getElementById("playerInfo");


const currentPick =

const status =
  document.getElementById("status");


const sheetFrame =
  document.getElementById("sheetFrame");

// ==================================================
// LOAD PLAYERS
// ==================================================


async function loadPlayers() {


  try {


    const response =

      await fetch(

        API_URL +

        "?action=getPlayers&_=" +

        Date.now(),

        {
          cache: "no-store"
        }

      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(

        data.error ||

        "Unable to load players."

      );

    }


    playerSelect.innerHTML =

      '<option value="">Select your name</option>';


    data.players.forEach(

      player => {


        const option =
          document.createElement("option");


        option.value =
          player;


        option.textContent =
          player;


        playerSelect.appendChild(
          option
        );


      }

    );


  }

  catch (error) {


    showStatus(

      "Unable to load players: " +

      error.message,

      "error"

    );


  }

}



// ==================================================
// LOAD PLAYER DATA
// ==================================================


async function loadPlayerData(player) {


  if (!player) {


    playerInfo.style.display =
      "none";


    return;

  }


  try {


    const response =

      await fetch(

        API_URL +

        "?action=getPlayerData" +

        "&player=" +

        encodeURIComponent(player) +

        "&_=" +

        Date.now(),

        {
          cache: "no-store"
        }

      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(

        data.error ||

        "Unable to load your picks."

      );

    }


    const picks =
      data.picks || {};



    // ------------------------------------------
    // FIND USED TEAMS
    // ------------------------------------------


    const usedTeams =

      new Set(

        Object.values(picks)

          .map(

            team =>

              String(team).trim()

          )

          .filter(Boolean)

      );



    // ------------------------------------------
    // CURRENT WEEK
    // ------------------------------------------


    const currentWeekName =
      "Week " + CURRENT_WEEK;


    const existingCurrentPick =
      picks[currentWeekName] || "";



    // ------------------------------------------
    // DISPLAY CURRENT PICK
    // --------------
